nodes:
- id: gateway
  path: ${FORGE_RUNTIME_BIN}/gateway
  args: --config gateway.yaml
  inputs:
    tick: dora/timer/millis/50
    benchmark_tool_in:
      source: robotwin_benchmark/tool_out
      queue_size: 32
    policy_tool_in:
      source: policy/tool_out
      queue_size: 32
  outputs:
  - tool_response
  - benchmark_tool_out
  - policy_tool_out
- id: robotwin_benchmark
  path: ${FORGE_RUNTIME_BIN}/robotwin_benchmark
  env:
    BENCHMARK_CONFIG: benchmark.yaml
    PYOPENGL_PLATFORM: egl
    MUJOCO_GL: egl
  inputs:
    tick: dora/timer/millis/1000
    tool_in:
      source: gateway/benchmark_tool_out
      queue_size: 32
    action:
      source: policy/action
      queue_size: 32
  outputs:
  - tool_out
  - proprio_state
  - image/head
  - image/left_wrist
  - image/right_wrist
  - policy_command
  - benchmark_status
  - benchmark_result
- id: policy
  path: ${FORGE_RUNTIME_BIN}/lerobot_infer
  args: infer --config policy.yaml
  env:
    HF_HUB_OFFLINE: "1"
  inputs:
    tick: dora/timer/millis/20
    tool_in:
      source: gateway/policy_tool_out
      queue_size: 32
    policy_command:
      source: robotwin_benchmark/policy_command
      queue_size: 32
    proprio_state: robotwin_benchmark/proprio_state
    image/head: robotwin_benchmark/image/head
    image/left_wrist: robotwin_benchmark/image/left_wrist
    image/right_wrist: robotwin_benchmark/image/right_wrist
  outputs:
  - tool_out
  - action
  - policy_command_status
