manifest_version: 2
name: robotwin-benchmark
version: 0.2.1
description: Run the RoboTwin 2.0 benchmark through Forge Query/Session tools.
skill_document: SKILL.md
gateway_url: http://127.0.0.1:19132
required_tools:
- robotwin.benchmark.describe
- robotwin.benchmark.run
- robotwin.policy
profiles:
  # <paradigm>-<policy>-<weight date MMDD>; the weight is weights.yaml g05-robotwin20-1006.
  vla-g05-1006:
    dataflow: profiles/vla-g05-1006/dataflow.yaml
    startup_timeout_s: 900
    required_binaries:
    - gateway
    - robotwin_benchmark
    - lerobot_infer
    required_assets:
    - profiles/vla-g05-1006/gateway.yaml
    - profiles/vla-g05-1006/benchmark.yaml
    - profiles/vla-g05-1006/policy.yaml
    - weights.yaml
    - locks/g05_robotwin20_1006.lock.json
    - scripts/prepare.py
    environment:
      PYOPENGL_PLATFORM: egl
      MUJOCO_GL: egl
artifacts:
  resolver: registry
  nodes:
    gateway:
      artifact_id: gateway-1.1.0-linux-x86_64
      version: 1.1.0
      platform: linux
      arch: x86_64
      artifact_type: executable_tar_gz
      entrypoint: gateway
      sha256: bb42c141b299a854fed2ff31f20be5b83551c7c47a30bce06fccd717da202387
    robotwin_benchmark:
      artifact_id: robotwin_benchmark-1.2.1-linux-x86_64
      version: 1.2.1
      platform: linux
      arch: x86_64
      artifact_type: directory_tar_gz
      entrypoint: robotwin_benchmark
      sha256: eda9855fcbbf583d48fa9329a7ffff2057c95c7f6808e6f179414f79e1815f7c
    lerobot_infer:
      artifact_id: lerobot_infer-1.1.1-linux-x86_64
      version: 1.1.1
      platform: linux
      arch: x86_64
      artifact_type: directory_tar_gz
      entrypoint: lerobot_infer
      sha256: e91d80b276d0b206043476a847afbf7d19f0144eb844727bb23447fd56a48170
