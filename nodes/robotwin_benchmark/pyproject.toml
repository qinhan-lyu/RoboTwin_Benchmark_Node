# Generated from the proven RoboTwin host runtime (envs/robotwin on 121, 2026-11-09)
# by gen_pyproject.py. This Node owns its environment: the launcher runs
# `uv sync --frozen` against the uv.lock next to this file. Never share it with another Node.
