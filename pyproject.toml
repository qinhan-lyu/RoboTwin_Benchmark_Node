[project]
name = "forge-benchmark-robotwin"
version = "1.1.0"
description = "Standalone RoboTwin benchmark node for Forge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs==0.4.1",
    "forge-msgs==1.2.0",
    "forge-tool[dora]==1.0.0",
    "numpy",
    "pyarrow",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    # RoboTwin 与 sapien 由评测环境提供（~/RoboTwin 仓库 + 其 .venv，
    # 见 README 的环境要求），不在此声明，避免把一整套仿真依赖拖进基础节点环境。
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "_core/tests", "bench_tool/tests"]
pythonpath = ["."]

[tool.uv]
package = false
